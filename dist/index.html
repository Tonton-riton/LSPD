<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEVEN // LSPD & DOJ | Panel de Gestion & Calculateur de Peines</title>
    <meta name="description" content="Panel de gestion et calculateur de peines LSPD / DOJ San Andreas" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script defer src="./assets/app.js"></script>
    <style>
/* ===== VARIABLES ===== */
:root {
    --bg-primary: #060b14;
    --bg-secondary: #0b1322;
    --bg-card: #101b30;
    --bg-card-hover: #162440;
    --bg-sidebar: #080e1a;
    --border: #1e3050;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a0;
    --text-muted: #555570;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-glow: rgba(59, 130, 246, 0.45);
    --green: #00e676;
    --green-bg: rgba(0, 230, 118, 0.1);
    --blue: #448aff;
    --blue-bg: rgba(68, 138, 255, 0.1);
    --orange: #ff9100;
    --orange-bg: rgba(255, 145, 0, 0.1);
    --red: #ff2a4b;
    --red-bg: rgba(255, 42, 75, 0.15);
    --yellow: #ffd600;
    --purple: #aa66ff;
    --sidebar-width: 260px;
    --topbar-height: 64px;
    --radius: 12px;
    --radius-sm: 8px;
}

/* ===== RESET ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== AUTH SCREEN ===== */
.auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
    padding: 20px;
}

.auth-container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.auth-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
    margin-bottom: 4px;
}

.auth-logo-img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.5));
    animation: pulse-glow-logo 2.5s infinite ease-in-out;
}

@keyframes pulse-glow-logo {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.45)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px rgba(59, 130, 246, 0.8)); transform: scale(1.04); }
}

.auth-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 32px;
}

.auth-form {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: left;
}

.auth-form h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    margin-bottom: 24px;
    text-align: center;
    color: var(--text-primary);
}

.auth-switch {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-muted);
}

.auth-switch a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
}

.auth-switch a:hover { text-decoration: underline; }

/* ===== FORMS ===== */
.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
    flex: 1;
}

.form-group label {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    display: flex;
    align-items: center;
    white-space: nowrap;
    min-height: 18px;
}

.form-group label i {
    margin-right: 6px;
    color: var(--accent);
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 12px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--accent);
}

.form-group textarea { resize: vertical; }

.form-row {
    display: flex;
    gap: 16px;
}

.sale-total {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--green);
    padding: 8px 0;
}

/* ===== BUTTONS ===== */
.btn {
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    white-space: nowrap;
}

.btn-primary { background: var(--accent); color: #ffffff; font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 18px var(--accent-glow); color: #ffffff; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--accent); color: var(--text-primary); }

.btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }

.btn-success { background: var(--green); color: #0a0a0f; font-weight: 700; }
.btn-success:hover { box-shadow: 0 4px 15px rgba(0,230,118,0.3); }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-full { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }

/* ===== PAGE HEADER ===== */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.page-header h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
}

.page-header h2 i {
    color: var(--accent);
}

/* ===== SIDEBAR ===== */
.app {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform 0.3s ease;
}

.sidebar-header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
    text-align: center;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent-glow);
}

.sidebar-logo-img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.45));
    transition: transform 0.25s ease, filter 0.25s ease;
}

.logo:hover .sidebar-logo-img {
    transform: scale(1.1) rotate(2deg);
    filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.8));
}

.logo i { font-size: 32px; }

.logo-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 4px;
}

.nav-menu {
    list-style: none;
    padding: 12px 0;
    flex: 1;
    overflow-y: auto;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    user-select: none;
}

.nav-item:hover { color: var(--text-primary); background: rgba(59, 130, 246, 0.08); }
.nav-item.active { color: var(--accent); background: rgba(59, 130, 246, 0.15); border-left-color: var(--accent); }
.nav-item i { width: 22px; text-align: center; font-size: 18px; }

.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
    border: 2px solid var(--accent);
    flex-shrink: 0;
}

.user-details { display: flex; flex-direction: column; }
.user-name { font-weight: 600; font-size: 15px; }
.user-role { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

.btn-logout {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ===== MAIN ===== */
.main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    min-height: 100vh;
    min-width: 0;
    overflow-x: hidden;
}

.topbar {
    height: var(--topbar-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 20px;
    cursor: pointer;
}

.topbar h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-secondary);
}

.role-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.role-badge.patron { background: var(--red-bg); color: var(--accent); }
.role-badge.manager { background: var(--orange-bg); color: var(--orange); }
.role-badge.vendeur { background: var(--blue-bg); color: var(--blue); }
.role-badge.staff { background: rgba(170,102,255,0.15); color: var(--purple); }

/* ===== PAGES ===== */
.page {
    padding: 24px;
    animation: fadeIn 0.3s ease;
    max-width: 100%;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== STAT CARDS ===== */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
}

.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.3s ease;
}

.stat-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    transform: translateY(-2px);
}

.stat-icon {
    width: 52px; height: 52px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
}

.stat-icon.green { background: var(--green-bg); color: var(--green); }
.stat-icon.blue  { background: var(--blue-bg);  color: var(--blue); }
.stat-icon.orange{ background: var(--orange-bg); color: var(--orange); }
.stat-icon.red   { background: var(--red-bg);   color: var(--red); }

.stat-info h3 { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
.stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; }

/* ===== CARDS ===== */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}

.card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.card-header h2 {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

.card-header h2 i { color: var(--accent); }
.card-body { padding: 20px; }

/* ===== TABLE ===== */
.table-responsive { overflow-x: auto; }

.data-table { width: 100%; border-collapse: collapse; }

.data-table th {
    text-align: left;
    padding: 12px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}

.data-table td {
    padding: 12px 14px;
    font-size: 14px;
    border-bottom: 1px solid rgba(42,42,62,0.5);
    color: var(--text-secondary);
}

.data-table tr:hover td { background: rgba(59, 130, 246, 0.05); color: var(--text-primary); }

.data-table .serial {
    font-family: 'Courier New', monospace;
    color: var(--orange);
    font-size: 13px;
    font-weight: 600;
}

.data-table .price { color: var(--green); font-weight: 600; }

/* ===== TOOLBAR ===== */
.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
}

.toolbar input,
.toolbar select {
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
}

.toolbar input { flex: 1; min-width: 200px; }
.toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

/* ===== STOCKS ===== */
.stock-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.stock-stat { display: flex; align-items: center; gap: 14px; padding: 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
.stock-stat i { width: 42px; height: 42px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--green); background: var(--green-bg); font-size: 18px; }
.stock-stat.warning i { color: var(--orange); background: var(--orange-bg); }
.stock-stat.danger i { color: var(--red); background: var(--red-bg); }
.stock-stat span { color: var(--text-secondary); }
.stock-stat strong { display: block; color: var(--text-primary); font: 700 22px 'Orbitron', sans-serif; }
.stock-add-form { margin-bottom: 20px; }
.stock-form-hint { color: var(--text-muted); margin: -4px 0 16px; font-size: 13px; }
.stock-toolbar { margin-top: 20px; }
.stock-table td strong, .stock-table td small { display: block; }
.stock-table td small { color: var(--text-muted); margin-top: 4px; }
.stock-status { display: inline-flex; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.stock-status.ok { color: var(--green); background: var(--green-bg); }
.stock-status.low { color: var(--orange); background: var(--orange-bg); }
.stock-status.empty { color: var(--red); background: var(--red-bg); }
.stock-quantity { display: block; font: 700 22px 'Orbitron', sans-serif; color: var(--green); }
.stock-quantity.low { color: var(--orange); }
.stock-quantity.empty { color: var(--red); }
.stock-category-filters { margin-top: 4px; }
.stock-catalogue-grid { grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); }
.weapon-card.stock-weapon-card { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 205px; }
.weapon-card.stock-card-ok { border-color: rgba(75, 211, 138, .3); }
.weapon-card.stock-card-low { border-color: rgba(255, 165, 0, .4); }
.weapon-card.stock-card-empty { border-color: rgba(255, 68, 68, .45); opacity: .88; }
.stock-weapon-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--green); }
.stock-card-low::before { background: var(--orange); }
.stock-card-empty::before { background: var(--red); }
.stock-card-location { display: flex; align-items: center; gap: 7px; min-height: 20px; color: var(--text-muted); font-size: 13px; }
.stock-card-location i { color: var(--accent); }
.stock-card-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 16px; }
.stock-card-main .stock-quantity { font-size: 32px; line-height: 1; }
.stock-card-main small { display: block; margin-top: 5px; color: var(--text-muted); }
.stock-card-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 7px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; }
.stock-card-footer i { margin-right: 4px; color: var(--text-secondary); }
.stock-card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(255, 255, 255, 0.08); flex-wrap: wrap; }
.stock-quick-adjust { display: inline-flex; align-items: center; gap: 3px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px 4px; }
.stock-adjust-btn { background: transparent; border: none; color: var(--text-secondary); min-width: 26px; height: 26px; padding: 0 4px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px; transition: all 0.15s ease; }
.stock-adjust-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
.stock-adjust-btn.plus:hover:not(:disabled) { background: var(--green-bg); color: var(--green); }
.stock-adjust-btn.minus:hover:not(:disabled) { background: var(--orange-bg); color: var(--orange); }
.stock-adjust-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.stock-action-buttons { display: flex; align-items: center; gap: 6px; }
.stock-btn-icon { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 5px 9px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s ease; }
.stock-btn-icon:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); background: rgba(59, 130, 246, 0.14); }
.stock-btn-icon.reset { color: var(--text-muted); }
.stock-btn-icon.reset:hover:not(:disabled) { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.stock-btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
@media (max-width: 700px) {
  .stock-summary { grid-template-columns: 1fr; }
  .stock-catalogue-grid { grid-template-columns: 1fr; }
}

/* ===== LIVRAISONS ===== */
.delivery-form { margin-bottom: 28px; }
.delivery-form-header, .delivery-form-actions, .delivery-history-title, .delivery-card-head, .delivery-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.delivery-form-header { margin-bottom: 18px; }
.delivery-form-header p, .delivery-history-title span { color: var(--text-muted); font-size: 13px; }
.delivery-total, .delivery-card-total { min-width: 105px; text-align: center; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--green-bg); color: var(--green); }
.delivery-total strong, .delivery-card-total strong { display: block; font: 700 22px 'Orbitron', sans-serif; }
.delivery-total span, .delivery-card-total span { font-size: 11px; }
.delivery-head-totals { display: flex; gap: 10px; }
.delivery-cost { min-width: 150px; text-align: center; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--orange); background: var(--orange-bg); }
.delivery-cost strong { display: block; font: 700 18px 'Orbitron', sans-serif; }
.delivery-cost span { font-size: 11px; }
.delivery-search { position: relative; margin: 8px 0 14px; }
.delivery-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.delivery-search input { width: 100%; height: 46px; padding: 0 44px 0 42px; color: var(--text-primary); background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary)); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font: 500 15px 'Rajdhani', sans-serif; box-shadow: inset 0 1px 0 rgba(255,255,255,.025); transition: border-color .2s, box-shadow .2s, background .2s; }
.delivery-search input::placeholder { color: var(--text-muted); }
.delivery-search input:hover { border-color: rgba(255,255,255,.18); }
.delivery-search input:focus { border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 0 3px rgba(255,68,68,.12), 0 0 18px rgba(255,68,68,.08); }
.delivery-search:focus-within i { color: var(--accent); }
.delivery-items-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; max-height: 390px; overflow-y: auto; padding-right: 4px; }
.delivery-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); transition: .2s; }
.delivery-item.selected { border-color: var(--green); background: var(--green-bg); }
.delivery-item-info strong, .delivery-item-info small { display: block; }
.delivery-item-info small { margin-top: 3px; color: var(--text-muted); }
.delivery-item-info .factory-price { color: var(--orange); font-weight: 600; }
.delivery-item input { width: 82px; text-align: center; font: 700 16px 'Orbitron', sans-serif; }
.delivery-form-actions { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-muted); }
.delivery-history-title { margin: 0 0 12px; }
.delivery-history { display: grid; gap: 12px; }
.delivery-card { padding: 18px; }
.delivery-card-head > div:first-child strong, .delivery-card-head > div:first-child span { display: block; }
.delivery-card-head > div:first-child span { color: var(--text-secondary); margin-top: 5px; }
.delivery-card-head i, .delivery-card-foot i { color: var(--accent); margin-right: 5px; }
.delivery-card-items { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.delivery-card-items > span { display: inline-flex; gap: 8px; padding: 7px 10px; border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--text-secondary); }
.delivery-card-items strong { color: var(--green); }
.delivery-card-items .delivery-history-item { display: flex; flex-direction: column; align-items: flex-start; }
.delivery-history-item > span { display: flex; gap: 8px; }
.delivery-history-item small { color: var(--orange); }
.delivery-history-cost { margin-left: auto; color: var(--orange); }
.delivery-card-foot { justify-content: flex-start; flex-wrap: wrap; color: var(--text-muted); font-size: 13px; }
@media (max-width: 700px) {
  .delivery-items-grid { grid-template-columns: 1fr; }
  .delivery-form-header, .delivery-form-actions, .delivery-card-head { align-items: stretch; flex-direction: column; }
  .delivery-total, .delivery-card-total { text-align: left; }
  .delivery-head-totals { flex-direction: column; }
  .delivery-history-cost { width: 100%; margin-left: 0; }
}

/* ===== EMPTY STATE ===== */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

.empty-state i { font-size: 48px; margin-bottom: 16px; display: block; }
.empty-state p { font-size: 16px; }

/* ===== CATALOGUE ===== */
.catalogue-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
}

.filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0a0f; }

.catalogue-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.weapon-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.3s ease;
}

.weapon-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 24px rgba(59, 130, 246, 0.15);
    transform: translateY(-3px);
}

.weapon-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
}

.weapon-name { font-size: 17px; font-weight: 700; }

.weapon-badge {
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}

.badge-pistolet    { background: var(--blue-bg);  color: var(--blue); }
.badge-smg         { background: var(--orange-bg); color: var(--orange); }
.badge-fusil       { background: var(--red-bg);    color: var(--red); }
.badge-fusil-pompe { background: rgba(170,102,255,0.15); color: var(--purple); }
.badge-sniper      { background: rgba(255,214,0,0.15); color: var(--yellow); }
.badge-munition, .badge-munitions, .badge-balle, .badge-balles { background: rgba(255,170,0,0.15); color: #ffaa00; }

.weapon-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }

.weapon-price {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 20px;
}

.weapon-sale-label, .weapon-factory-price span { display: block; margin-bottom: 3px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
.weapon-factory-price { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 12px 0 8px; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--orange-bg); }
.weapon-factory-price span { margin: 0; color: var(--orange); }
.weapon-factory-price strong { color: var(--orange); font-family: 'Orbitron', sans-serif; font-size: 14px; }

.weapon-price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.edit-price-btn {
    opacity: 0.5;
    transition: opacity 0.2s;
    flex-shrink: 0;
}

.weapon-card:hover .edit-price-btn { opacity: 1; }

.weapon-calibre {
    font-size: 12px;
    font-weight: 700;
    color: var(--orange);
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.weapon-calibre i { font-size: 10px; opacity: 0.7; }

.weapon-price-range {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
}

.weapon-price-range i { color: var(--accent); font-size: 10px; }
.weapon-price-range .range-sep { opacity: 0.5; }

/* ===== ADD ARTICLE SECTION ===== */
.add-article-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 20px;
}

.add-article-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* ===== SALE CART SECTION ===== */
.sale-cart-section {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-bottom: 20px;
}

.sale-cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
}

.sale-cart-header i { color: var(--accent); }

.cart-grand-total {
    font-family: 'Orbitron', sans-serif;
    color: var(--green);
    font-size: 14px;
}

.cart-empty {
    padding: 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(42,42,62,0.5);
    flex-wrap: wrap;
    transition: background 0.2s;
}

.cart-item:last-child { border-bottom: none; }
.cart-item:hover { background: rgba(255,255,255,0.02); }

.cart-item-info {
    flex: 1;
    min-width: 120px;
}

.cart-item-name {
    display: block;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-primary);
}

.cart-item-meta {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

.cart-item-serial {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 160px;
}

.cart-serial-input {
    padding: 7px 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--orange);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 600;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
}

.cart-serial-input:focus { border-color: var(--accent); }

.cart-item-total {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--green);
    min-width: 80px;
    text-align: right;
}

/* ===== EMPLOYES ===== */
.employes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.employe-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.3s ease;
}

.employe-card:hover { border-color: var(--accent); }

.employe-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
}

.employe-avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex-shrink: 0;
}

.employe-avatar.patron  { background: var(--red-bg);   color: var(--accent);  border: 2px solid var(--accent); }
.employe-avatar.manager { background: var(--orange-bg); color: var(--orange);  border: 2px solid var(--orange); }
.employe-avatar.vendeur { background: var(--blue-bg);   color: var(--blue);    border: 2px solid var(--blue); }
.employe-avatar.staff   { background: rgba(170,102,255,0.15); color: var(--purple); border: 2px solid var(--purple); }

.employe-name { font-size: 18px; font-weight: 700; }

.employe-grade {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
}

.employe-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.employe-stat {
    text-align: center;
    padding: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
}

.employe-stat-value { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 18px; }
.employe-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

/* ===== ACCOUNTS TABLE ===== */
.role-select {
    padding: 6px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    cursor: pointer;
    outline: none;
}

.role-select:focus { border-color: var(--accent); }

/* ===== MODAL ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 5, 10, 0.88) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000 !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
}

.modal, .modal-box, .modal-content {
    background: #0f1018 !important;
    background-color: #0f1018 !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    border-radius: var(--radius);
    width: 90%;
    max-width: 550px;
    max-height: 85vh;
    overflow-y: auto;
    animation: modalIn 0.3s ease;
    position: relative;
    z-index: 10001 !important;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95), 0 0 1px rgba(255, 255, 255, 0.2) !important;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.modal-header h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
}

.modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
}

.modal-close:hover { color: var(--accent); }
.modal-body { padding: 20px; }

/* ===== TOAST ===== */
.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 100000 !important;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    padding: 14px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideInRight 0.3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    min-width: 280px;
    border-left: 3px solid var(--accent);
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.toast.fading { opacity: 0; transform: translateX(50px); }
.toast.success { border-left-color: var(--green); }
.toast.error   { border-left-color: var(--red); }
.toast.warning { border-left-color: var(--orange); }
.toast.info    { border-left-color: var(--blue); }

@keyframes slideInRight {
    from { opacity: 0; transform: translateX(50px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* ===== BLANCHIMENT ===== */
.blanch-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 10px 20px;
    margin-bottom: 24px;
    background: repeating-linear-gradient(
        -45deg,
        rgba(59, 130, 246, 0.12),
        rgba(59, 130, 246, 0.12) 10px,
        transparent 10px,
        transparent 20px
    );
    border: 1px solid rgba(255, 42, 75, 0.3);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: pulse-border 2.5s ease-in-out infinite;
}

@keyframes pulse-border {
    0%, 100% { border-color: rgba(255, 42, 75, 0.3); }
    50%       { border-color: rgba(255, 42, 75, 0.8); box-shadow: 0 0 16px rgba(255, 42, 75, 0.2); }
}

.blanch-progress-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 24px;
}

.blanch-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.blanch-progress-bar {
    height: 10px;
    background: var(--bg-secondary);
    border-radius: 20px;
    overflow: hidden;
}

.blanch-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--purple), var(--accent));
    border-radius: 20px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 10px rgba(170, 102, 255, 0.4);
}

.blanch-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    margin-bottom: 0;
}

.blanch-palier {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid;
    background: var(--bg-secondary);
    transition: all 0.2s;
}

.blanch-palier:hover {
    transform: translateX(4px);
}

.blanch-method-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(170, 102, 255, 0.12);
    color: var(--purple);
    border: 1px solid rgba(170, 102, 255, 0.3);
    white-space: nowrap;
}

/* ── Calculateur ── */
.blanch-calc-card { margin-bottom: 0; }

.blanch-calc-top {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.blanch-slider-group {
    flex: 1.2;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.blanch-slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
}

.blanch-slider-header label {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
}

.blanch-pct-badge {
    padding: 3px 12px;
    border-radius: 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid;
    transition: all 0.3s;
}

.blanch-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 20px;
    background: var(--bg-secondary);
    outline: none;
    cursor: pointer;
    position: relative;
}

.blanch-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--slider-color, var(--accent));
    cursor: pointer;
    border: 3px solid var(--bg-primary);
    box-shadow: 0 0 10px var(--slider-color, var(--accent));
    transition: box-shadow 0.2s, background 0.3s;
}

.blanch-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--slider-color, var(--accent));
    cursor: pointer;
    border: 3px solid var(--bg-primary);
    box-shadow: 0 0 10px var(--slider-color, var(--accent));
}

.blanch-slider-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
}

.blanch-presets {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.blanch-preset-btn {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
}

.blanch-preset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.blanch-preset-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
}

.blanch-result-row {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 16px;
}

.blanch-result-box {
    flex: 1;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 20px 24px;
    border: 1px solid var(--border);
    text-align: center;
    transition: all 0.3s;
}

.blanch-result-box:hover { transform: translateY(-2px); }

.blanch-result-give { border-color: rgba(255, 42, 75, 0.2); }
.blanch-result-keep { border-color: rgba(0, 230, 118, 0.2); }

.blanch-result-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.blanch-result-pct {
    opacity: 0.6;
    font-size: 11px;
}

.blanch-result-amount {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 700;
    transition: all 0.3s;
}

.blanch-result-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
}

.blanch-result-divider {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
}

.blanch-split-bar {
    display: flex;
    height: 12px;
    border-radius: 20px;
    overflow: hidden;
    gap: 2px;
}

.blanch-split-give,
.blanch-split-keep {
    height: 100%;
    border-radius: 20px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    opacity: 0.85;
}

/* ===== LOCATIONS PANEL ===== */
.rentals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
}

.rental-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
}

.rental-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
}

.rental-card:hover::before { opacity: 1; }

.rental-card:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 32px rgba(59, 130, 246, 0.12);
    transform: translateY(-3px);
}

.rental-card.rental-expired {
    border-color: rgba(255, 68, 68, 0.4);
    opacity: 0.75;
}

.rental-card.rental-expired::before {
    background: linear-gradient(90deg, #ff4444, transparent);
    opacity: 1;
}

.rental-card.rental-penthouse {
    border-color: rgba(255, 214, 0, 0.3);
}

.rental-card.rental-penthouse::before {
    background: linear-gradient(90deg, var(--yellow), transparent);
    opacity: 0.7;
}

.rental-card.rental-penthouse:hover {
    border-color: var(--yellow);
    box-shadow: 0 8px 32px rgba(255, 214, 0, 0.12);
}

/* Card Header */
.rental-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
}

.rental-room-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
}

.rental-card.rental-penthouse .rental-room-badge {
    color: var(--yellow);
}

.rental-card.rental-expired .rental-room-badge {
    color: var(--text-muted);
}

.rental-room-badge i { font-size: 14px; }

.rental-room-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
}

/* Card Body */
.rental-card-body {
    padding: 14px 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.rental-info-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.rental-info-item {
    flex: 1;
    min-width: 120px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.rental-info-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
}

.rental-info-label i {
    color: var(--accent);
    font-size: 10px;
}

.rental-info-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
}

.rental-price-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px !important;
    font-weight: 700 !important;
    color: var(--green) !important;
    text-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
}

.rental-notes {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
}

.rental-notes i {
    color: var(--yellow);
    font-size: 12px;
    margin-top: 2px;
    flex-shrink: 0;
}

.rental-notes span {
    font-size: 13px;
    color: var(--text-secondary);
    font-style: italic;
    line-height: 1.4;
}

/* Progress Bar */
.rental-progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
}

.rental-progress-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
}

.rental-progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s linear;
    box-shadow: 0 0 6px currentColor;
}

.rental-progress-label {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
}

/* Card Footer */
.rental-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
}

/* Timer */
.rental-timer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
}

.rental-timer.expired {
    color: #ff4444;
    animation: pulse-timer 1.5s infinite;
}

@keyframes pulse-timer {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
}

/* Duration Preview */
.rental-duration-preview {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.rental-duration-preview i {
    color: var(--accent);
    font-size: 12px;
}

.rental-duration-preview strong {
    color: var(--accent);
}


/* ===== LOCATIONS LAYOUT ===== */
.locations-layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    align-items: start;
}

.locations-form-card {
    position: sticky;
    top: calc(var(--topbar-height) + 16px);
}

.locations-list-col {
    min-width: 0;
}

/* ===== MODAL ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
}

.modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 480px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.25s ease;
}

.modal-body {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.modal-header h3 {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
}

.modal-header h3 i { color: var(--accent); }

.modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
}

.modal-close:hover { color: var(--text-primary); background: rgba(255,255,255,0.07); }

.modal-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.modal-rental-info {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
    color: var(--text-secondary);
}

.modal-rental-info i {
    color: var(--accent);
    width: 16px;
    margin-right: 6px;
}

.modal-rental-info strong { color: var(--text-primary); }

.modal-current-end {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
}

.modal-current-end span { color: var(--orange); font-weight: 600; }

.modal-new-end {
    background: rgba(255, 42, 75, 0.06);
    border: 1px solid rgba(255, 42, 75, 0.2);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}

.modal-new-end i { color: var(--accent); }

.modal-new-end strong {
    color: var(--accent);
    font-size: 14px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
}

/* ===== GESTION COMPTES — CARDS GRID ===== */
.gc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.gc-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: all 0.3s ease;
    position: relative;
}

.gc-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 24px rgba(59, 130, 246, 0.12);
    transform: translateY(-2px);
}

.gc-card-me {
    border-color: rgba(255, 42, 75,0.3);
}

.gc-card-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
}

.gc-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    flex-shrink: 0;
    position: relative;
}

.gc-me-dot {
    position: absolute;
    bottom: 2px; right: 0;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg-card);
}

.gc-card-identity {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-width: 0;
}

.gc-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.gc-username, .gc-joined {
    font-size: 12px;
    color: var(--text-muted);
}

.gc-role-row {
    display: flex;
    align-items: center;
}

.fiche-role-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.gc-stats {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    gap: 8px;
}

.gc-stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.gc-stat-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
}

.gc-stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.gc-stat-sep {
    width: 1px;
    height: 32px;
    background: var(--border);
}

.gc-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.gc-role-select {
    flex: 1;
    padding: 7px 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
}

.gc-role-select:hover, .gc-role-select:focus {
    border-color: var(--accent);
}

/* ===== FICHE VENDEUR ===== */
.fiche-hero {
    display: flex;
    gap: 24px;
    align-items: center;
    background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26,26,46,0.6) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
}

.fiche-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255, 42, 75,0.06) 0%, transparent 70%);
    pointer-events: none;
}

.fiche-avatar-wrap {
    position: relative;
    flex-shrink: 0;
}

.fiche-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255, 42, 75,0.12);
    border: 3px solid var(--accent);
    box-shadow: 0 0 24px rgba(255, 42, 75,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
}

.fiche-me-badge {
    position: absolute;
    bottom: -4px; right: -4px;
    background: var(--accent);
    color: #000;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 10px;
    letter-spacing: 1px;
}

.fiche-info {
    flex: 1;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.fiche-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
}

.fiche-username, .fiche-date {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
}

.fiche-username i, .fiche-date i { color: var(--accent); opacity: 0.7; }

.fiche-hero-stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    margin-left: auto;
}

.fiche-hero-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0,230,118,0.3);
}

.fiche-hero-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Bar chart */
.fiche-barchart {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    height: 140px;
    padding: 0 4px;
}

.fiche-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
}

.fiche-bar-value {
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
}

.fiche-bar-track {
    flex: 1;
    width: 100%;
    background: var(--bg-secondary);
    border-radius: 4px 4px 0 0;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
}

.fiche-bar-fill {
    width: 100%;
    background: linear-gradient(180deg, var(--accent) 0%, rgba(59, 130, 246, 0.45) 100%);
    border-radius: 4px 4px 0 0;
    transition: height 0.6s ease;
    min-height: 2px;
}

.fiche-bar-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
}

/* Highlights */
.fiche-highlight {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
}

.fiche-highlight-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.fiche-highlight-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
}

.fiche-highlight-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
}

/* Category badge in table */
.fiche-cat-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    background: var(--blue-bg);
    color: var(--blue);
    text-transform: capitalize;
}

/* ===== MON PROFIL MODAL ===== */
.sidebar-profile-btn {
    cursor: pointer;
    padding: 8px;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    position: relative;
}

.sidebar-profile-btn:hover {
    background: rgba(255, 255, 255, 0.05);
}

.sidebar-edit-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    color: var(--accent);
    transition: all 0.2s;
}

.sidebar-profile-btn:hover .sidebar-edit-icon {
    opacity: 1;
}

.profil-modal {
    max-width: 500px !important;
    padding: 0 !important;
    overflow: hidden;
}

.profil-modal-header {
    background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26,26,46,0.6) 100%);
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
}

.profil-modal-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    border: 2px solid;
    flex-shrink: 0;
}

.profil-modal-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
}

.profil-modal-username {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}

.profil-modal-role {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.profil-tabs {
    display: flex;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
}

.profil-tab {
    flex: 1;
    padding: 16px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.profil-tab:hover {
    color: var(--text-primary);
}

.profil-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(255, 42, 75, 0.05);
}

.profil-info-banner {
    padding: 12px 16px;
    background: rgba(68, 138, 255, 0.06);
    border: 1px dashed rgba(68, 138, 255, 0.3);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.profil-info-banner i {
    color: var(--blue);
    font-size: 16px;
    margin-top: 2px;
}

.profil-info-banner strong {
    color: var(--text-primary);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) {
    .locations-layout {
        grid-template-columns: 1fr;
    }
    .locations-form-card {
        position: static;
    }
}

@media (max-width: 900px) {
    .fiche-hero { padding: 20px; }
    .fiche-hero-stat { margin-left: 0; align-items: flex-start; }
}

@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; }
    .menu-toggle { display: block; }
    .form-row { flex-direction: column; gap: 0; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .rentals-grid { grid-template-columns: 1fr; }
    .rental-card-footer { flex-wrap: wrap; gap: 8px; }
    .gc-grid { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
    .catalogue-grid { grid-template-columns: 1fr; }
    .fiche-name { font-size: 20px; }
}

/* ===== HISTORIQUE LOCATIONS — BADGES ===== */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.badge-active-loc {
    background: rgba(255, 42, 75, 0.12);
    color: var(--accent);
    border: 1px solid rgba(255, 42, 75, 0.3);
}

.badge-active-loc i { font-size: 7px; animation: pulse-dot 1.5s infinite; }

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
}

.badge-expired-loc {
    background: rgba(255, 68, 68, 0.12);
    color: #ff6b6b;
    border: 1px solid rgba(255, 68, 68, 0.3);
}

.badge-checkout {
    background: rgba(0, 230, 118, 0.12);
    color: var(--green);
    border: 1px solid rgba(0, 230, 118, 0.3);
}

.row-checkout td { opacity: 0.75; }
.row-expired-loc td { opacity: 0.85; }

/* ===== FACTURE MODAL ===== */
.facture-modal {
    max-width: 640px !important;
    max-height: 90vh;
    overflow-y: auto;
}

.facture-body {
    gap: 0 !important;
    padding: 0 !important;
}

.facture-header-band {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    background: linear-gradient(135deg, #12121a 0%, #1a1a2e 100%);
    flex-wrap: wrap;
    gap: 12px;
}

.facture-logo-zone {
    display: flex;
    align-items: center;
    gap: 14px;
}

.facture-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
}

.facture-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
}

.facture-date-emis {
    font-size: 12px;
    color: var(--text-muted);
}

.facture-status-badge {
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.facture-status-badge.status-active {
    background: rgba(255, 42, 75, 0.12);
    color: var(--accent);
    border: 1px solid rgba(255, 42, 75, 0.3);
}

.facture-status-badge.status-done {
    background: rgba(0, 230, 118, 0.12);
    color: var(--green);
    border: 1px solid rgba(0, 230, 118, 0.3);
}

.facture-status-badge.status-expired {
    background: rgba(255, 68, 68, 0.12);
    color: #ff6b6b;
    border: 1px solid rgba(255, 68, 68, 0.3);
}

.facture-divider {
    height: 1px;
    background: var(--border);
    margin: 0;
}

.facture-two-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.facture-two-cols .facture-section:first-child {
    border-right: 1px solid var(--border);
}

.facture-section {
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.facture-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
}

.facture-section-title i {
    color: var(--accent);
    font-size: 12px;
}

.facture-field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    gap: 12px;
}

.facture-field span {
    color: var(--text-muted);
    flex-shrink: 0;
}

.facture-field strong {
    color: var(--text-primary);
    font-size: 14px;
    text-align: right;
}

.facture-dates-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
}

.facture-total-zone {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(255, 42, 75,0.05) 0%, rgba(26,26,46,0.4) 100%);
    border-top: 1px solid rgba(255, 42, 75, 0.15);
}

.facture-total-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
}

.facture-total-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255, 42, 75, 0.3);
}

.facture-footer-note {
    text-align: center;
    padding: 12px 24px;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
}

/* ===== PRINT STYLES ===== */
@media print {
    body * { visibility: hidden; }
    .facture-modal, .facture-modal * { visibility: visible; }
    .facture-modal { position: fixed; top: 0; left: 0; width: 100%; }
    .btn, .modal-close { display: none !important; }
    .facture-body { color: #000; background: white; }
    .facture-header-band { background: #f8f8f8 !important; border-bottom: 2px solid #ccc; }
    .facture-total-zone { background: #f0f0f0 !important; }
    .facture-section-title i { color: #333 !important; }
    .facture-num { color: #333 !important; }
}

/* ===== ROLES & PERMISSIONS RBAC ===== */
.perm-role-tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.perm-role-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.perm-role-tab:hover {
    transform: translateY(-2px);
}

.perm-level-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    font-weight: 600;
}

.perm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
}

.perm-category-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}

.perm-cat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
}

.perm-cat-header:hover {
    background: rgba(255, 255, 255, 0.04);
}

.perm-cat-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-primary);
}

.perm-cat-count {
    font-size: 11px;
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 8px;
    border-radius: 12px;
    color: var(--text-muted);
    font-weight: 600;
}

.perm-items-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px;
}

.perm-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
}

.perm-item:hover {
    background: rgba(255, 255, 255, 0.04);
}

.perm-item.active {
    background: rgba(255, 42, 75, 0.04);
    border-color: rgba(255, 42, 75, 0.2);
}

.perm-item.locked {
    cursor: default;
    opacity: 0.85;
}

.perm-item input[type="checkbox"] {
    display: none;
}

.perm-custom-checkbox {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 10px;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.perm-item.active .perm-custom-checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
}

.perm-item-details {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.perm-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
}

.perm-code {
    font-size: 10px;
    font-family: monospace;
    color: var(--text-muted);
    margin-top: 2px;
}

/* ===== LOGS D'AUDIT ===== */
.log-cat-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid transparent;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.log-action-tag {
    display: inline-block;
    font-family: monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);

/* ===== ROLE BADGES DYNAMIQUES ===== */
.role-badge.ultime, .role-badge.patron {

}

.role-badge.superviseur {

}

.role-badge.staff_illegal, .role-badge.manager {

.role-badge.staff {

.role-badge.helper, .role-badge.vendeur {

/* ==========================================================================
   CARTE INTERACTIVE GTA V & LEAFLET STYLING
   ========================================================================== */

/* Page Cartographie Globale */
.gta-cartography-page {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 100px);
    overflow: hidden;
    padding-bottom: 0;
}

.cartography-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-shrink: 0;
}

.carto-title-zone h2 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
}

.carto-sub {
    font-size: 0.85rem;
    color: var(--text-muted);
}

/* Filtres de catégories */
.carto-category-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex-shrink: 0;
}

.carto-cat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    color: var(--text-secondary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
}

.carto-cat-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
}

.carto-cat-btn.active {
    background: rgba(255, 42, 75, 0.12);
    color: #fff;
    border-color: var(--accent) !important;
    box-shadow: 0 0 12px rgba(255, 42, 75, 0.2);
}

.cat-count-badge {
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}

/* Layout Carte + Sidebar */
.carto-main-layout {
    display: flex;
    flex: 1;
    gap: 16px;
    min-height: 0;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.carto-map-container {
    flex: 1;
    height: 100%;
    position: relative;
    background: #0d1117;
    border-radius: 12px 0 0 12px;
    overflow: hidden;
}

.carto-sidebar-drawer {
    width: 320px;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    flex-shrink: 0;
}

.carto-sidebar-search {
    padding: 12px;
    position: relative;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
}

.carto-sidebar-search i.fa-search {
    position: absolute;
    left: 22px;
    color: var(--text-muted);
    font-size: 13px;
}

.carto-sidebar-search input {
    width: 100%;
    padding: 8px 30px 8px 34px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
}

.clear-search-btn {
    position: absolute;
    right: 20px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
}

.carto-points-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.carto-point-card {
    background: var(--bg-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}

.carto-point-card:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 42, 75, 0.3);
    transform: translateX(2px);
}

.carto-point-card.selected {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.12);
}

.point-icon-box {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}

.point-info {
    flex: 1;
    min-width: 0;
}

.point-top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
}

.point-title {
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.point-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
}

.point-desc-preview {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.point-gps-coords {
    font-size: 10px;
    color: var(--text-muted);
    font-family: monospace;
}

.point-actions {
    display: flex;
    gap: 4px;
}

.btn-link-view {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    padding: 6px;
    border-radius: 4px;
    transition: background 0.2s;
}

.btn-link-view:hover {
    background: rgba(255, 42, 75, 0.15);
}

/* ── Marqueurs Custom Leaflet (GTA Style) ── */
.custom-gta-marker {
    background: none !important;
    border: none !important;
}

.gta-marker-wrapper {
    position: relative;
    width: 34px;
    height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.marker-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #11141a;
    border: 2px solid var(--marker-color, #ff2a4b);
    color: var(--marker-color, #ff2a4b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 0 10px var(--marker-color, #ff2a4b), inset 0 0 6px rgba(0, 0, 0, 0.8);
    position: relative;
    z-index: 2;
    transition: transform 0.2s ease;
}

.custom-gta-marker:hover .marker-icon-box {
    transform: scale(1.15);
}

.marker-dot {
    width: 6px;
    height: 6px;
    background: var(--marker-color, #ff2a4b);
    border-radius: 50%;
    margin-top: -2px;
    box-shadow: 0 0 6px var(--marker-color, #ff2a4b);
    z-index: 2;
}

.marker-pulse {
    position: absolute;
    top: 4px;
    left: 5px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--marker-color, #ff2a4b);
    opacity: 0.6;
    animation: gta-pulse 2s infinite ease-out;
    z-index: 1;
}

@keyframes gta-pulse {
    0% {
        transform: scale(0.8);
        opacity: 0.8;
    }
    100% {
        transform: scale(2.4);
        opacity: 0;
    }
}

/* Marqueur de sélection (crosshairs) */
.picker-marker .picker-box {
    background: #ff2a5f !important;
    border-color: #ffffff !important;
    color: #ffffff !important;
    box-shadow: 0 0 15px #ff2a5f !important;
}

/* ── Barre d'outils flottante de la carte ── */
.gta-map-floating-bar {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 1000;
}

.map-style-toggle {
    display: flex;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    overflow: hidden;
}

.map-tool-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.map-tool-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
}

.map-tool-btn.active {
    background: var(--accent);
    color: #000;
}

.recenter-btn {
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    padding: 7px 12px;
}

.recenter-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
}

.gta-map-gps-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    font-family: monospace;
    z-index: 1000;
    display: flex;
    align-items: center;

.gta-map-hint-badge {
    position: absolute;
    top: 12px;
    left: 12px;

    font-weight: 700;
    z-index: 1000;
    box-shadow: 0 0 12px rgba(255, 42, 95, 0.4);

.gta-map-popup .popup-header {
