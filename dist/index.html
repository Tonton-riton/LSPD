.preset-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
}

.preset-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.btn-preset-loc {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-preset-loc:hover {
    background: rgba(255, 42, 75, 0.15);
    border-color: var(--accent);
    color: #fff;
}

.map-picker-footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    gap: 12px;
    flex-wrap: wrap;
}

.map-picker-coords-inputs {
    display: flex;
    gap: 14px;
    align-items: center;
}

.form-group-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
}

.coord-input {
    width: 90px;
    padding: 6px 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: #fff;
    font-family: monospace;
    font-size: 13px;
}

.map-picker-actions {
    display: flex;
    gap: 8px;
}

/* ── Mode Dessin de Zone & Territoires (GTA Style) ── */
.gta-drawing-toolbar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 17, 23, 0.95);
    backdrop-filter: blur(12px);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1001;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 42, 75, 0.25);
    animation: slideDownFade 0.3s ease;
}

@keyframes slideDownFade {
    from {
        opacity: 0;
        transform: translate(-50%, -15px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

.drawing-status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.drawing-pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: gta-pulse 1.5s infinite;
}

.drawing-toolbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.draw-tool-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.draw-tool-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
}

.draw-tool-btn.success {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.45);
}

.draw-tool-btn.success:hover:not(:disabled) {
    background: #e2ff66;
    box-shadow: 0 0 15px rgba(255, 42, 75, 0.7);
}

.draw-tool-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.draw-tool-btn.danger {
    color: #ff5252;
}

.draw-tool-btn.danger:hover:not(:disabled) {
    background: rgba(255, 82, 82, 0.2);
    border-color: #ff5252;
}

/* ── Sommets de Dessin (Vertices) ── */
.gta-draw-vertex {
    width: 12px;
    height: 12px;
    background: #fff;
    border: 2px solid #000;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    cursor: pointer;
}

.gta-draw-vertex-first {
    width: 18px;
    height: 18px;
    background: var(--accent);
    border: 2px solid #000;
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
    animation: gta-pulse 1.8s infinite;
    cursor: pointer;
}

/* ── Labels & Tooltips des Zones ── */
.gta-zone-label {
    background: rgba(10, 14, 20, 0.85) !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    color: #fff !important;
    font-family: 'Rajdhani', sans-serif !important;
    font-weight: 700 !important;
    font-size: 12px !important;
    letter-spacing: 0.5px !important;
    padding: 3px 8px !important;
    border-radius: 4px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6) !important;
}

.gta-zone-label::before {
    display: none !important;
}

/* ── Palette de Couleurs pour Zones ── */
.zone-color-palette {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
}

.color-swatch-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-size: 11px;
}

.color-swatch-btn:hover {
    transform: scale(1.15);
}

.color-swatch-btn.active {
    border-color: #fff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
}

/* ── Onglets Barre Latérale (Points / Zones) ── */
.carto-sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2);
}

.sidebar-tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    font-family: 'Rajdhani', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
    border-bottom: 2px solid transparent;
}

.sidebar-tab-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.03);
}

.sidebar-tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(255, 42, 75, 0.05);
}

/* ══════════════════════════════════════════════════════════════
   BUSINESS & OPÉRATIONS CRIMINELLES — Design v2
══════════════════════════════════════════════════════════════ */

/* ── Hero header ───────────────────────────────────────────── */
.biz-hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 28px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, rgba(255, 42, 75,0.06) 0%, rgba(0,0,0,0) 60%);
    border: 1px solid rgba(255, 42, 75,0.15);
    border-radius: 16px;
    flex-wrap: wrap;
}

.biz-hero-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.biz-hero-icon {
    width: 56px;
    height: 56px;
    background: rgba(59, 130, 246, 0.14);
    border: 2px solid rgba(255, 42, 75,0.25);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--accent);
    box-shadow: 0 0 20px rgba(255, 42, 75,0.15);
    flex-shrink: 0;
}

.biz-hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--text-primary);
    letter-spacing: 0.5px;
    margin: 0;
}

.biz-hero-sub {
    color: var(--text-muted);
    font-size: 13px;
    margin: 4px 0 0;
}

.biz-add-btn {
    white-space: nowrap;
    flex-shrink: 0;
}

/* ── Stats ─────────────────────────────────────────────────── */
.biz-stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
}

@media (max-width: 900px) {
    .biz-stats-row { grid-template-columns: repeat(2, 1fr); }
}

.biz-stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--sc, #ff2a4b);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: box-shadow 0.2s;
}

.biz-stat-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}

.biz-stat-icon-wrap {
    width: 46px;
    height: 46px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--sc, #ff2a4b);
    flex-shrink: 0;
}

.biz-stat-content {
    flex: 1;
    min-width: 0;
}

.biz-stat-num {
    font-size: 26px;
    font-weight: 900;
    font-family: 'Orbitron', sans-serif;
    color: var(--text-primary);
    line-height: 1;
}

.biz-stat-lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 5px;
}

/* ── Barre de filtres ──────────────────────────────────────── */
.biz-filters-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
}

.biz-search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
}

.biz-search-ico {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
}

.biz-search-input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--bg-input, rgba(255,255,255,0.05));
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
}

.biz-search-input:focus {
    border-color: var(--accent);
}

.biz-filter-sel {
    min-width: 160px;
    flex-shrink: 0;
}

/* ── Compteur ──────────────────────────────────────────────── */
.biz-count {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-left: 2px;
}

/* ── Grille de cartes ──────────────────────────────────────── */
.biz-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
}

/* ── Carte ─────────────────────────────────────────────────── */
.biz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.2s, border-color 0.2s;
}

.biz-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(var(--tc),0.2);
    border-color: rgba(255, 42, 75,0.2);
}

/* Barre colorée en haut de chaque carte */
.biz-card-topbar {
    height: 3px;
    width: 100%;
}

.biz-card-inner {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* Ligne titre */
.biz-card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.biz-card-ico {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
}

.biz-card-titles {
    flex: 1;
    min-width: 0;
}

.biz-card-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.biz-card-type-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
}

.biz-status-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* Infos de la carte */
.biz-card-infos {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border: 1px solid var(--border);
    min-height: 60px;
}

.biz-info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
}

.biz-info-row.muted {
    opacity: 0.45;
}

.biz-info-ico {
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    font-size: 12px;
}

.biz-info-val {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Footer de carte */
.biz-card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
}

/* Bouton payé v2 */
.biz-pay-btn2 {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    border: 2px solid;
    background: transparent;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
}

.biz-pay-btn2.paid {
    border-color: #2ecc71;
    color: #2ecc71;
}

.biz-pay-btn2.paid:hover:not(:disabled) {
    background: rgba(46,204,113,0.15);
    box-shadow: 0 0 12px rgba(46,204,113,0.25);
}

.biz-pay-btn2.unpaid {
    border-color: #e74c3c;
    color: #e74c3c;
}

.biz-pay-btn2.unpaid:hover:not(:disabled) {
    background: rgba(231,76,60,0.15);
    box-shadow: 0 0 12px rgba(231,76,60,0.25);
}

.biz-pay-btn2:disabled {
    opacity: 0.45;
    cursor: default;
}

.biz-card-btns {
    display: flex;
    gap: 6px;
}

/* ── Empty state ───────────────────────────────────────────── */
.biz-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    padding: 80px 20px;
}

.biz-empty-icon {
    width: 80px;
    height: 80px;
    background: rgba(255, 42, 75,0.06);
    border: 2px solid rgba(255, 42, 75,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: rgba(255,255,255,0.2);
    margin-bottom: 8px;
}

.biz-empty h3 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    color: var(--text-primary);
    margin: 0;
}

.biz-empty p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
}

/* ── Formulaire ────────────────────────────────────────────── */
.biz-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.biz-type-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
}

.biz-type-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    transition: all 0.18s;
}

.biz-type-btn i {
    font-size: 18px;
}

.biz-type-btn:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.2);
}

.biz-type-btn.selected {
    border-width: 2px;
}

.gps-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.gps-row .form-input { flex: 1; }

/* ── Détail modal ──────────────────────────────────────────── */
.biz-detail {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.biz-detail-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    border-left: 4px solid;
}

.biz-detail-ico {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.biz-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.biz-ditem {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
}

.biz-dlbl {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
}

.biz-detail-notes {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
}

.biz-detail-notes p {
    margin: 8px 0 0;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-wrap;
    font-size: 14px;
}

/* ── Confirm delete ────────────────────────────────────────── */
.delete-confirm-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    text-align: center;
}

.ml-auto { margin-left: auto; }

/* ── IMPRESSION FACTURE RP (@media print) ────────────────────────── */
@media print {
    /* Cache l'UI globale */
    body, html {
        background: #ffffff !important;
        color: #111111 !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
        font-family: 'Rajdhani', Arial, sans-serif !important;
    }

    .sidebar,
    .topbar,
    .stats-grid,
    .panel-box,
    .toolbar,
    .card,
    .page-header,
    .modal-close,
    .no-print,
    button {
        display: none !important;
    }

    .main-content {
        margin: 0 !important;
        padding: 0 !important;
        min-height: auto !important;
    }

    .page {
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Rend la modal visible en pleine page imprimable */
    .modal-overlay {
        position: static !important;
        display: block !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        inset: auto !important;
    }

    .modal-box.invoice-modal-print {
        position: static !important;
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: 2px solid #222222 !important;
        background: #ffffff !important;
        color: #111111 !important;
        border-radius: 6px !important;
        padding: 0 !important;
        margin: 0 auto !important;
        page-break-inside: avoid !important;
    }

    .invoice-header-box {
        background: #f4f4f8 !important;
        border-bottom: 2px solid #ff2a4b !important;
        padding: 20px 24px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .invoice-header-box h2,
    .invoice-header-box div,
    .invoice-header-box p {
        color: #111111 !important;
    }

    .invoice-body-box {
        padding: 20px 24px !important;
        background: #ffffff !important;
    }

    .invoice-subbox {
        background: #f8f8fc !important;
        border: 1px solid #d0d0dc !important;
        color: #111111 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .invoice-subbox * {
        color: #111111 !important;
    }

    .invoice-table {
        border-collapse: collapse !important;
        width: 100% !important;
    }

    .invoice-table th {
        background: #eeeeee !important;
        color: #222222 !important;
        border-bottom: 2px solid #999999 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .invoice-table td {
        border-bottom: 1px solid #cccccc !important;
        color: #111111 !important;
    }

    .invoice-table * {
        color: #111111 !important;
    }

    .invoice-stamp-box {
        border: 2px dashed #ff2a4b !important;
        color: #ff2a4b !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .invoice-total-amount {
        color: #008744 !important;
    }
}

/* Universal Select and Option Dark Cyberpunk Styling */
select, .form-input select, .form-group select {
    background-color: #12121a !important;
    color: #f1f5f9 !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-radius: 8px !important;
    padding: 8px 12px !important;
    outline: none !important;
    cursor: pointer !important;
    font-family: inherit !important;
}

select:focus, .form-input select:focus, .form-group select:focus {
    border-color: #00a8ff !important;
    box-shadow: 0 0 8px rgba(0, 168, 255, 0.2) !important;
}

select option {
    background-color: #161622 !important;
    color: #ffffff !important;
    padding: 10px 14px !important;
}

select option:hover, select option:checked {
    background-color: #242438 !important;
    color: #00a8ff !important;
}

/* Universal Modal Close Button Styling */
.btn-close, .modal-close {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 32px !important;
    height: 32px !important;
    border-radius: 8px !important;
    background: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #94a3b8 !important;
    font-size: 16px !important;
    line-height: 1 !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
    padding: 0 !important;
}

.btn-close:hover, .modal-close:hover {
    background: rgba(239, 68, 68, 0.2) !important;
    border-color: rgba(239, 68, 68, 0.4) !important;
    color: #ef4444 !important;
    transform: scale(1.05);
}

/* Universal Input Fallback Styling */
input[type="text"],
input[type="password"],
input[type="email"],
input[type="number"],
input[type="search"] {
    background-color: #12121a;
    color: #e8e8f0;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input[type="text"]:focus,
input[type="password"]:focus,
input[type="email"]:focus,
input[type="number"]:focus,
input[type="search"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(255, 42, 75, 0.25);
}

/* ═══════════════════════════════════════════════════════════════
   GROUP DETAIL MODAL & MEMBERS STYLING (.gm-*)
   ═══════════════════════════════════════════════════════════════ */

.gm-section {
    margin-bottom: 22px;
}

.gm-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.gm-section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
}

.gm-section-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}

.gm-count-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-secondary);

/* Top Stat Cards */
.gm-stat-cards-grid {

    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.gm-stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
}

.gm-stat-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.14);
    transform: translateY(-1px);
}

.gm-stat-card-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}

.gm-stat-card-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
}

.gm-stat-card-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
}

.gm-stat-card-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.gm-stat-card-value.price {
    font-family: 'Orbitron', sans-serif;
    color: var(--green);
    text-shadow: 0 0 10px rgba(0, 230, 118, 0.25);
}

/* Notes Card */
.gm-notes-card {
    background: linear-gradient(135deg, rgba(255, 42, 75, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    margin-bottom: 20px;
}

.gm-notes-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.gm-notes-content {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-secondary);
    white-space: pre-line;
}

/* Empty State */
.gm-empty-state {
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 22px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
}

.gm-empty-icon-wrap {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);

    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-muted);

}

.gm-empty-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
}

.gm-empty-desc {
    font-size: 12px;
    color: var(--text-muted);

}

/* Members List */
.gm-members-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
}

.gm-member-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    transition: all 0.2s ease;
}

.gm-member-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.14);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}

.gm-member-avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    font-family: 'Orbitron', sans-serif;

}

.gm-member-info {
    flex: 1;

    flex-direction: column;
    gap: 4px;
}

.gm-member-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.gm-member-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
}

/* Role Badges */
.gm-role-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.gm-role-chef {
    background: rgba(255, 42, 75, 0.15);

    border: 1px solid rgba(59, 130, 246, 0.45);
    box-shadow: 0 0 10px rgba(255, 42, 75, 0.2);
}

.gm-role-second {
    background: rgba(170, 102, 255, 0.15);
    color: #aa66ff;
    border: 1px solid rgba(170, 102, 255, 0.4);
    box-shadow: 0 0 10px rgba(170, 102, 255, 0.2);
}

.gm-role-soldier {
    background: rgba(68, 138, 255, 0.15);
    color: #448aff;
    border: 1px solid rgba(68, 138, 255, 0.4);
    box-shadow: 0 0 10px rgba(68, 138, 255, 0.2);
}

.gm-role-recruit {
    background: rgba(255, 214, 0, 0.15);
    color: #ffd600;
    border: 1px solid rgba(255, 214, 0, 0.4);
    box-shadow: 0 0 10px rgba(255, 214, 0, 0.2);
}

.gm-role-finance {
    background: rgba(0, 230, 118, 0.15);

    border: 1px solid rgba(0, 230, 118, 0.4);
    box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
}

.gm-role-default {
    background: rgba(255, 255, 255, 0.07);
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.gm-member-sub {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
}

.gm-id-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0, 229, 255, 0.12);
    color: #00e5ff;
    border: 1px solid rgba(0, 229, 255, 0.28);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
}

.gm-id-badge i {
    color: #00e5ff;
    font-size: 10px;
}

.gm-discord-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(88, 101, 242, 0.12);
    color: #9aa8f5;
    border: 1px solid rgba(88, 101, 242, 0.28);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
}

.gm-discord-badge i {
    color: #5865F2;
}

.gm-member-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.gm-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s ease;
}

.gm-action-btn.edit:hover {
    background: rgba(68, 138, 255, 0.15);
    border-color: rgba(68, 138, 255, 0.35);
    color: #448aff;
    transform: scale(1.08);
}

.gm-action-btn.delete:hover {
    background: rgba(255, 42, 75, 0.15);
    border-color: rgba(255, 42, 75, 0.35);
    color: #ff2a4b;
    transform: scale(1.08);
}

/* Inline Edit Form */
.gm-inline-edit-form {
    display: flex;
    gap: 8px;
    flex: 1;
    align-items: center;
    flex-wrap: wrap;
    background: rgba(0, 0, 0, 0.3);
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(68, 138, 255, 0.3);
}

/* Add Member Form */
.gm-add-form-box {
    background: linear-gradient(135deg, rgba(26, 26, 46, 0.7) 0%, rgba(18, 18, 26, 0.9) 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 6px 20px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
}

.gm-add-form-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.gm-add-form-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
}

.gm-add-form-title i {
    color: var(--accent);
}

.gm-form-inputs-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.gm-input-wrap {
    position: relative;
    flex: 1;
    min-width: 130px;
    display: flex;
    align-items: center;
}

.gm-input-wrap i {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
}

.gm-input {
    width: 100% !important;
    background: rgba(10, 10, 15, 0.8) !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-radius: 8px !important;
    color: var(--text-primary) !important;
    padding: 8px 12px 8px 34px !important;
    font-size: 13px !important;
    outline: none !important;
    transition: all 0.2s ease !important;
}

.gm-input:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 12px rgba(255, 42, 75, 0.25) !important;
    background: rgba(15, 15, 22, 0.95) !important;
}

.gm-input::placeholder {
    color: var(--text-muted);
    opacity: 0.8;
}

.gm-btn-add {
    padding: 8px 18px !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    border-radius: 8px !important;
    white-space: nowrap !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    box-shadow: 0 2px 10px rgba(255, 42, 75, 0.3) !important;
}

.gm-quick-roles {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
}

.gm-quick-roles-lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.gm-quick-role-chip {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
}

.gm-quick-role-chip:hover {
    background: rgba(255, 42, 75, 0.12);
    border-color: rgba(255, 42, 75, 0.3);
    color: var(--accent);
    transform: translateY(-1px);
}

/* Labs Section */
.gm-labs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
}

.gm-lab-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
}

.gm-lab-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.14);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}

.gm-lab-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}

.gm-lab-icon.paid {
    background: rgba(0, 230, 118, 0.12);
    color: var(--green);
    border: 1px solid rgba(0, 230, 118, 0.25);
    box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
}

.gm-lab-icon.unpaid {
    background: rgba(255, 42, 75, 0.12);
    color: var(--red);
    border: 1px solid rgba(255, 42, 75, 0.25);
    box-shadow: 0 0 10px rgba(255, 42, 75, 0.15);
}

.gm-lab-info {
    flex: 1;
    min-width: 0;
}

.gm-lab-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.gm-lab-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
}

.gm-lab-price {
    color: var(--green);
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    font-size: 11.5px;
}

.gm-lab-price small {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10.5px;
    opacity: 0.8;
}

.gm-pay-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}

.gm-pay-badge.paid {
    background: rgba(0, 230, 118, 0.15);
    color: var(--green);
    border: 1px solid rgba(0, 230, 118, 0.3);
}

.gm-pay-badge.unpaid {
    background: rgba(255, 42, 75, 0.15);
    color: var(--red);
    border: 1px solid rgba(255, 42, 75, 0.3);
}

    flex-wrap: wrap;
}

/* ═════════════════════════════════════════════════════════════════════════════
   BOURSE DYNAMIQUE DES ARMES
   ═════════════════════════════════════════════════════════════════════════════ */
.bourse-page {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.bourse-global-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid currentColor;
}

/* ── Dashboard Bourse ── */
.bourse-dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

.bourse-dash-card {
    background: rgba(18, 20, 29, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.bourse-dash-card h3 {
    margin: 0 0 4px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}

.bourse-dash-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 6px;
    font-size: 13px;
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
}

.bourse-dash-item:hover {
    background: rgba(255, 255, 255, 0.07);
    transform: translateX(3px);
}

/* ── Filtres Bourse ── */
.bourse-filters {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: rgba(255, 255, 255, 0.02);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.bourse-cat-filters, .bourse-sort {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

/* ── Grille & Cartes Armes ── */
.bourse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

.bourse-card {
    background: rgba(18, 20, 29, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
}

.bourse-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
}

.bourse-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}

.bourse-card:hover::before {
    opacity: 1;
}

.bourse-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bourse-weapon-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.3px;
}

.bourse-trend-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    font-family: monospace;
}

.bourse-card-price {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.bourse-market-price {
    font-size: 24px;
    font-weight: 800;
    font-family: 'Orbitron', monospace, sans-serif;
    letter-spacing: 0.5px;
}

.bourse-base-price {
    font-size: 12px;
    color: var(--text-muted);
}

.bourse-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    margin-top: auto;
}

.bourse-card-volume {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
}

/* ── Modal Historique & Graphique ── */
.bourse-history-modal {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.bourse-history-period {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

.bourse-history-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    background: rgba(255, 255, 255, 0.03);
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.bourse-history-info > div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.bourse-history-info span:first-child {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.bourse-history-current-price {
    font-size: 20px;
    font-weight: 800;
    font-family: 'Orbitron', monospace, sans-serif;
}

/* ── Modal Configuration Bourse ── */
.bourse-config-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.bourse-config-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}

.bourse-config-row label {
    font-size: 13px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
}

.bourse-config-slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    max-width: 260px;
}

.bourse-config-slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
}

.bourse-config-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    min-width: 50px;
    text-align: right;
    font-family: monospace;
}

.bourse-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 4px 12px 4px 6px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
    user-select: none;
}

.bourse-toggle.active {
    background: rgba(0, 230, 118, 0.15);
    border-color: rgba(0, 230, 118, 0.4);
    color: #00e676;
}

.bourse-toggle-knob {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #888;
    transition: all 0.2s;
}

.bourse-toggle.active .bourse-toggle-knob {
    background: #00e676;
    box-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
}

/* ── Styles du Panel Admin Bourse ── */
.bourse-tab-switcher button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.bourse-tab-switcher button:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
}

.bourse-tab-switcher button.btn-accent {
    background: var(--accent);
    color: #0b0e14;
    box-shadow: 0 2px 10px rgba(0, 229, 255, 0.3);
}

.bourse-diagnostic-section tr:hover td {
    background: rgba(255, 255, 255, 0.02);
}

.bourse-regulation-section input[type="range"] {
    accent-color: var(--accent);
}

.bourse-admin-topbar .btn {
    transition: transform 0.15s ease, box-shadow 0.2s ease;
}

.bourse-admin-topbar .btn:hover {
    transform: translateY(-1px);
}

/* ===== MODULE ENQUÊTES ===== */
.enquete-card:hover {
    transform: translateY(-3px);
    border-color: rgba(59, 130, 246, 0.45) !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(59, 130, 246, 0.14) !important;
}
.enquete-detail h4 {
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 6px;
}
